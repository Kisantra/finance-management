name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: vendor/bin/pint

      # Gerbang ini sebelumnya tidak ada, dan 14 error tipe sempat menumpuk tanpa
      # terlihat. Tiga di antaranya cacat yang dilihat pengguna: paginasi yang
      # melempar (layar putih), tombol Simpan yang mati, dan tabel Template Builder
      # yang dirender PDF memakai renderer yang salah. Compiler sudah tahu ketiganya.
      - name: Periksa tipe TypeScript
        run: npm run types

