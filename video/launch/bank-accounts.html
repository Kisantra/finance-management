<head>

<style>
/*
 * Video peluncuran modul Rekening Bank (45,6 dtk, 100 BPM, 19 bar, loop).
 * Setiap gaya dihitung dari waktu di window.seek(t): tanpa animasi CSS, tanpa timer, tanpa state antar-frame.
 * Render: Chromium headless memanggil window.seek(t) per subframe (60 fps × 3, dirata-rata untuk motion blur),
 * soundtrack dari window.renderAudio() (WAV base64), lalu H.264 BT.709 + AAC di-mux dengan ffmpeg.
 */
:root{--page:#F6F6F8;--card:#FFFFFF;--inner:#F1F1F4;--chip:#E4E4E9;--ink:#141416;--ink2:#52525C;--ink3:#66666F;--line:rgba(0,0,0,.08);--lineS:rgba(0,0,0,.14);--accent:#2563EB;--pos:#047857;--neg:#C2410C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--page)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--page)}
/* Blur kamera berarah: #camBlur diputar θ + blur sumbu-x, #camUnrot diputar −θ (sama seperti ubin). 2240 ≥ diagonal layar. */
#camBlur{position:absolute;left:-160px;top:-580px;width:2240px;height:2240px;transform-origin:50% 50%}
#camUnrot{position:absolute;left:160px;top:580px;width:1920px;height:1080px;transform-origin:960px 540px}
#world{position:absolute;left:0;top:0;width:1920px;height:1400px;transform-origin:0 0}
#overlay{position:absolute;left:0;top:0;width:1920px;height:1080px}
.abs{position:absolute}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .16em;margin:0 -.03em -.16em}
.mask>span{display:inline-block;white-space:nowrap}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 1px 2px rgba(20,20,22,.04)}
.cardTitle{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600}
.countChip{min-width:28px;height:26px;padding:0 9px;border-radius:13px;background:var(--inner);font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.row{position:absolute;left:12px;width:396px;height:96px;border-radius:18px}
.rowSel{position:absolute;left:0;top:0;width:396px;height:96px;border-radius:18px;background:var(--inner);border:1px solid var(--lineS)}
.rowIcon{position:absolute;left:16px;top:24px;width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center}
.rowName{font-size:17px;font-weight:600}
.rowBank{font-size:14px;color:var(--ink2)}
.rowAmt{font-size:17px;font-weight:700}
.bigNum32{font-size:32px;font-weight:800;letter-spacing:-.02em}
.sumRow{position:absolute;left:24px;width:372px;display:flex;justify-content:space-between;align-items:center}
.sumLbl{font-size:15px;color:var(--ink2)}
.sumVal{font-size:15px;font-weight:700}
.chip{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--lineS);background:#fff;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap}
.naik{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:14px;background:rgba(4,120,87,.10);color:var(--pos);font-size:13px;font-weight:700}
.statLbl{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2);font-weight:500}
.statIco{width:30px;height:30px;border-radius:10px;background:var(--inner);display:flex;align-items:center;justify-content:center}
.statVal{font-size:28px;font-weight:700;letter-spacing:-.015em}
.cardH{font-size:18px;font-weight:600}
.cardS{font-size:14px;color:var(--ink2);margin-top:3px}
.legend{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);font-weight:500}

.txRefBg{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:9px;background:var(--chip);transform-origin:0 50%}
.txMeta{position:absolute;left:60px;top:70px;font-size:13px;color:var(--ink2);white-space:nowrap}
.txAmt{position:absolute;right:0;top:4px;font-size:18px;font-weight:700}
#backdrop{position:absolute;left:-3000px;top:-3000px;width:8000px;height:8000px;background:rgba(20,20,22,.26);z-index:9}
.dlg{position:absolute;background:#fff;border-radius:28px;border:1px solid var(--line);box-shadow:0 40px 100px rgba(20,20,22,.20),0 2px 6px rgba(20,20,22,.06);z-index:10}
.dIcon{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:14px;background:var(--inner);display:flex;align-items:center;justify-content:center}
.dTitle{position:absolute;left:96px;top:30px;font-size:24px;font-weight:700;letter-spacing:-.01em}

.lbl{position:absolute;font-size:14px;font-weight:600;color:var(--ink2)}
.fld{position:absolute;height:48px;border-radius:14px;background:var(--inner);border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;font-size:16px;font-weight:500;gap:10px;white-space:nowrap;overflow:hidden}
.fld .chev{margin-left:auto;display:flex}
.pre{width:52px;align-self:stretch;margin-left:-16px;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-weight:700}
.ph{color:var(--ink3)}
.caret{display:inline-block;width:2px;height:21px;background:var(--ink);margin-left:1px;margin-right:-3px;vertical-align:-4px}
.btnG{position:absolute;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--ink2)}
.btnP{position:absolute;height:48px;border-radius:24px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;white-space:nowrap}
.opt{position:absolute;left:8px;width:320px;height:40px;border-radius:10px;display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:500}
.box{position:absolute;border-radius:16px;background:var(--inner);padding:14px 18px}
.boxK{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.06em}
.boxN{font-size:16px;font-weight:600;margin-top:4px;white-space:nowrap}
.boxB{font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap}
.hint{position:absolute;font-size:13px;color:var(--ink3);white-space:nowrap}
.sumCol{position:absolute;top:16px}
.sumCol .l{font-size:13px;color:var(--ink2)}
.sumCol .v{font-size:19px;font-weight:700;margin-top:4px}
.pill{height:44px;padding:0 20px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap}
#tileOuter{position:absolute;left:0;top:0;z-index:5}
#tileInner{position:absolute;overflow:hidden}
.tl{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:16px;font-weight:600;white-space:nowrap}
#cursor{position:absolute;left:0;top:0;width:32px;height:32px;z-index:20;transform-origin:4px 3px}
#endCard{position:absolute;left:0;top:0;z-index:6}
.cap{position:absolute;background:#fff;border:1px solid var(--line);border-radius:30px;padding:26px 38px 30px;box-shadow:0 18px 50px rgba(20,20,22,.10);font-size:50px;font-weight:800;letter-spacing:-.028em;line-height:1.08;white-space:nowrap}
.cap .k{color:var(--accent)}
.capLine{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.capLine>span{display:inline-block}
.bigT{position:absolute;left:0;width:1920px;text-align:center;color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="camBlur"><div id="camUnrot"><div id="world"></div></div></div>
  <div id="overlay"></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="mb" x="-400%" y="-400%" width="900%" height="900%" color-interpolation-filters="sRGB">
      <feGaussianBlur id="mbBlur" stdDeviation="0 0"/>
    </filter>
    <filter id="cb" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur id="cbBlur" stdDeviation="0 0"/>
    </filter>
  </defs>
</svg>
<script>
'use strict';
// ───────────────────────── waktu & easing ─────────────────────────
const W = 1920, H = 1080;
const BPM = 100, BEAT = 60 / BPM, BEATS = 76, DURATION = BEATS * BEAT; // 45,6 dtk = 19 bar
window.DURATION = DURATION;
const b = (n) => n * BEAT;
const clamp = (x, a = 0, c = 1) => (x < a ? a : x > c ? c : x);
const lerp = (a, c, p) => a + (c - a) * p;
/** Pegas teredam (overshoot ±1%) — 0 → 1, tenang setelah ~dur detik. */
function spring(dt, dur = 0.5) {
  if (dt <= 0) return 0;
  const z = 0.82, w = 8 / dur, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
const expoOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const expoIn = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10));
const expoInOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2);
const cubicInOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const prog = (t, t0, dur) => clamp((t - t0) / dur);
const fmt = (n) => Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const rp = (n) => 'Rp ' + fmt(n);
const $ = (id) => document.getElementById(id);

// ───────────────────────── ikon (lucide) ─────────────────────────
const ICON = {
  building: '<path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/>',
  downLeft: '<path d="M17 7 7 17"/><path d="M17 17H7V7"/>',
  upRight: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
  leftRight: '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  trend: '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  cal: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>',
  chevD: '<path d="m6 9 6 6 6-6"/>',
  book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
};
const svg = (name, size, color = 'currentColor', sw = 2, id = '') =>
  `<svg ${id ? `id="${id}"` : ''} width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;
const mk = (id, text, cls = '', style = '') => `<span class="mask"><span id="${id}" class="${cls}" style="${style}">${text}</span></span>`;

// ───────────────────────── data (contoh realistis, konsisten) ─────────────────────────
const ROWS = [
  { name: 'BCA - Operasional', bank: 'Bank Central Asia' },
  { name: 'Mandiri - Proyek', bank: 'Bank Mandiri' },
  { name: 'BNI - Investasi', bank: 'Bank Negara Indonesia' },
];
const MONTHS = ['Nov', 'Des', 'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt'];
const INC = [3.2, 4.1, 5.0, 4.4, 6.2, 5.1, 4.8, 6.9, 5.5, 6.6, 4.0, 7.6];
const EXP = [2.1, 3.0, 4.2, 3.1, 4.8, 3.9, 3.2, 5.1, 4.4, 5.0, 3.1, 7.4];
const SEG = [
  { l: 'OPERASIONAL', v: '17,6jt', f: 0.38, c: '#141416' },
  { l: 'MAKAN MINUM', v: '10,2jt', f: 0.22, c: '#52525C' },
  { l: 'OPEX BULANAN', v: '8,8jt', f: 0.19, c: '#8B8B95' },
  { l: 'PINDAH DANA ANTAR REKENING', v: '5,0jt', f: 0.11, c: '#B4B4BE' },
  { l: 'LAINNYA', v: '4,7jt', f: 0.10, c: '#D9D9DF' },
];
const TRF = 'TRF1791790800';
// Nilai yang berubah karena aksi di video: [waktu mulai, nilai] — saldo selalu = saldo awal + masuk − keluar.
const VAL = {
  bca: [[0, 48702500], [b(27), 49452500], [b(42), 44450000]],
  mandiri: [[0, 125000000], [b(43), 130000000]],
  bni: [[0, 114303000]],
  total: [[0, 0], [b(9), 288005500], [b(27.6), 288755500], [b(43.2), 288753000]],
  sumIn: [[0, 177852500], [b(29), 178602500], [b(43.2), 183602500]],
  sumOut: [[0, 96847000], [b(43.2), 101849500]],
  sumNet: [[0, 81005500], [b(30), 81755500], [b(43.2), 81753000]],
  statIn: [[0, 62450000], [b(27.6), 63200000]],
  statOut: [[0, 41320000], [b(43.2), 46322500]],
  statNet: [[0, 21130000], [b(27.6), 21880000], [b(43.2), 16877500]],
  big: [[0, 288005500], [b(64.3), 288753000]],
};
function valAt(key, t, dur = 0.65) {
  const s = VAL[key];
  let v = s[0][1];
  for (let i = 1; i < s.length; i++) {
    if (t < s[i][0]) break;
    v = lerp(s[i - 1][1], s[i][1], expoOut(prog(t, s[i][0], key === 'total' && i === 1 ? 0.95 : dur)));
  }
  return v;
}

// Ketikan & klik — juga dipakai audio (bunyi klik + ketukan tombol).
const TYPE = [
  { id: 'fJumlahV', text: '750.000', t0: b(19.15), t1: b(20.35) },
  { id: 'fDescV', text: 'Sewa ruang rapat oleh PT Arunika Media', t0: b(23.1), t1: b(24.25) },
  { id: 'tJumlahV', text: '5.000.000', t0: b(36.12), t1: b(37.0) },
  { id: 'tBiayaV', text: '2.500', t0: b(38.1), t1: b(38.55) },
];
const CLICKS = [13, 18, 19, 21, 22, 23, 25, 33, 35, 36, 38, 40].map(b);
window.CLICKS = CLICKS;
window.TYPE_TIMES = TYPE.flatMap((ty) => Array.from({ length: ty.text.length }, (_, i) => ty.t0 + ((i + 0.5) / ty.text.length) * (ty.t1 - ty.t0)));
const typed = (ty, t) => ty.text.slice(0, Math.round(ty.text.length * prog(t, ty.t0, ty.t1 - ty.t0)));

// ───────────────────────── DOM ─────────────────────────
function build() {
  const world = $('world');
  const rows = ROWS.map((r, i) => `
    <div class="row" id="row${i}" style="top:${68 + i * 104}px">
      ${i === 0 ? '<div class="rowSel" id="row0sel"></div>' : ''}
      <div class="rowIcon" id="row${i}icon">${svg('building', 22, '#141416')}</div>
      <div class="abs" style="left:80px;top:13px">${mk(`row${i}name`, r.name, 'rowName')}</div>
      <div class="abs" style="left:80px;top:37px">${mk(`row${i}bank`, r.bank, 'rowBank')}</div>
      <div class="abs" style="left:80px;top:58px" id="row${i}amtW">${mk(`row${i}amt`, '', 'rowAmt')}</div>
      <div class="abs" id="row${i}trend" style="right:18px;top:18px">${svg('trend', 18, '#047857')}</div>
      <div class="abs" id="row${i}chev" style="right:16px;top:58px">${svg('chevR', 18, '#66666F')}</div>
    </div>`).join('');

  const gw = 664 / 12;
  let chart = '';
  for (const v of [0, 2, 4, 6, 8]) {
    const y = 400 - (v / 8) * 290;
    chart += `<div class="abs gridL" style="left:88px;width:664px;top:${y}px"></div><div class="abs gridT" style="left:0;width:78px;top:${y - 9}px">${v ? 'Rp ' + v + 'jt' : 'Rp 0'}</div>`;
  }
  MONTHS.forEach((m, i) => {
    const gx = 88 + i * gw;
    chart += `<div class="bar inc" id="bi${i}" style="left:${gx + 10}px;width:16px"></div><div class="bar exp" id="be${i}" style="left:${gx + 30}px;width:16px"></div><div class="abs mLbl" style="left:${gx}px;width:${gw}px;top:412px">${m}</div>`;
  });

  world.innerHTML = `
  <div id="hook" class="abs" style="left:0;top:0;width:1920px;height:1080px;z-index:2">
    <div class="abs" style="left:0;top:322px;width:1920px;text-align:center;font-size:144px;font-weight:800;letter-spacing:-.04em;line-height:1">
      ${mk('hw0', 'Saldo')}<span style="display:inline-block;width:.24em"></span>${mk('hw1', 'tersebar')}
    </div>
    <div class="abs" style="left:0;top:612px;width:1920px;text-align:center;font-size:144px;font-weight:800;letter-spacing:-.04em;line-height:1">
      ${mk('hw2', 'di')}<span style="display:inline-block;width:.24em"></span>${mk('hw3', 'banyak')}<span style="display:inline-block;width:.24em"></span>${mk('hw4', 'rekening')}
    </div>
  </div>

  <div id="page" class="abs" style="left:0;top:0;width:1920px;height:1400px">
    <div class="abs" style="left:120px;top:84px">${mk('pTitle', 'Rekening Bank', '', 'font-size:46px;font-weight:700;letter-spacing:-.02em')}</div>
    <div class="abs" style="left:122px;top:146px">${mk('pSub', 'Pantau saldo, transaksi, dan pembayaran di semua rekening Anda.', '', 'font-size:18px;color:var(--ink2)')}</div>
    <div class="abs" style="left:0;top:100px;width:1800px;display:flex;justify-content:flex-end;gap:12px">
      <div class="pill" id="pBtnTut" style="border:1px solid var(--lineS);background:#fff">Tutorial</div>
      <div class="pill" id="pBtnAdd" style="background:var(--ink);color:#fff">${svg('plus', 18, '#fff')}Tambah Rekening</div>
    </div>

    <div class="card" id="listCard" style="left:120px;top:212px;width:420px;height:456px">
      <div class="abs cardTitle" style="left:24px;top:22px"><span id="listIco">${svg('building', 18, '#52525C')}</span>${mk('listTitle', 'Rekening')}</div>
      <div class="abs countChip" id="listCount" style="right:24px;top:20px">3</div>
      ${rows}
    </div>

    <div class="card" id="sumCard" style="left:120px;top:688px;width:420px;height:292px">
      <div class="rowSel" id="sumSel" style="left:12px;top:54px;width:396px;height:82px;border-radius:16px"></div>
      <div class="abs cardTitle" style="left:24px;top:22px"><span id="sumIco">${svg('wallet', 18, '#52525C')}</span>${mk('sumTitle', 'Ringkasan Total')}</div>

// ───────────────────────── kamera (titik fokus dunia + zoom) ─────────────────────────
// [ketukan, cx, cy, zoom, jenis]: 'lin' = dorongan pelan, 'move' = pindah ala screen-studio.
const CAM = [
  [0, 960, 540, 1.0],
  [3.95, 960, 540, 1.04, 'lin'],
  [4.95, 160, 440, 1.55, 'move'],
  [7.95, 170, 446, 1.6, 'lin'],

  [15.0, 150, 600, 1.165, 'lin'],
  [16.0, 1190, 330, 1.3, 'move'],

  [31.25, 150, 600, 1.165, 'lin'],
  [32.15, 1190, 330, 1.3, 'move'],
  [33.15, 1196, 332, 1.35, 'lin'],
  [33.95, 1200, 530, 1.5, 'move'],
  [40.6, 1202, 532, 1.56, 'lin'],
  [41.55, 150, 380, 1.5, 'move'],
  [43.85, 155, 385, 1.56, 'lin'],
  // M3–M4: zoom dipilih agar tepi frame jatuh di ruang kosong, bukan memotong angka/teks kartu tetangga.
  [44.75, 1190, 1110, 1.43, 'move'],
  [47.45, 1190, 1110, 1.487, 'lin'],
  [48.45, 1005, 740, 1.98, 'move'],
  [52.6, 1005, 740, 2.06, 'lin'],
  [53.55, 1760, 744, 1.9, 'move'],   // donat di kiri, ruang kosong kanan halaman untuk caption
  [59.55, 1760, 744, 1.976, 'lin'],
  [60.8, 960, 665, 0.87, 'move'],
  [63.95, 960, 665, 0.905, 'lin'],
  [67.95, 960, 665, 0.94, 'lin'],
  [68.85, 960, 540, 0.96, 'move'],
  [76, 960, 540, 1.0, 'lin'],
];
function camera(t) {
  const bt = t / BEAT;
  let k0 = CAM[0];
  if (bt <= k0[0]) return { cx: k0[1], cy: k0[2], z: k0[3] };
  for (let i = 1; i < CAM.length; i++) {
    const k1 = CAM[i];
    if (bt <= k1[0]) {
      const p = (bt - k0[0]) / (k1[0] - k0[0]);
      const e = k1[4] === 'move' ? expoInOut(p) : p;
      return { cx: lerp(k0[1], k1[1], e), cy: lerp(k0[2], k1[2], e), z: k0[3] * Math.pow(k1[3] / k0[3], e) };
    }
    k0 = k1;
  }
  return { cx: k0[1], cy: k0[2], z: k0[3] };
}
const toWorld = (cam, sx, sy) => ({ x: cam.cx + (sx - W / 2) / cam.z, y: cam.cy + (sy - H / 2) / cam.z });
/**
 * Blur kamera mengikuti kecepatan & arah: kecepatan layar dunia di 9 titik sampel → arah rata-rata,
 * σ sejajar (pan) dan σ tegak lurus (komponen zoom ≈ isotropik). σ = v/600 px ≈ panjang rana 180°
 * dikurangi sebaran 3 subframe, sehingga salinan subframe menyatu jadi coreng halus.
 */
const CAM_SAMPLES = [320, 960, 1600].flatMap((x) => [180, 540, 900].map((y) => [x, y]));
function cameraBlur(t, cam) {
  const dt = 1 / 240, c0 = camera(t - dt);
  const vs = CAM_SAMPLES.map(([sx, sy]) => {
    const w = toWorld(cam, sx, sy);
    return [(sx - ((w.x - c0.cx) * c0.z + W / 2)) / dt, (sy - ((w.y - c0.cy) * c0.z + H / 2)) / dt];
  });
  const mx = vs.reduce((s, v) => s + v[0], 0) / vs.length, my = vs.reduce((s, v) => s + v[1], 0) / vs.length;
  const ang = Math.hypot(mx, my) > 1 ? Math.atan2(my, mx) : 0, ux = Math.cos(ang), uy = Math.sin(ang);
  const rms = (f) => Math.sqrt(vs.reduce((s, v) => s + f(v) ** 2, 0) / vs.length) / 600;
  // Komponen tegak lurus (zoom) dibuat separuh: blur isotropik penuh terlihat seperti defocus, bukan gerak.
  return { ang: ang * 180 / Math.PI, par: Math.min(40, rms((v) => v[0] * ux + v[1] * uy)), perp: Math.min(20, 0.5 * rms((v) => v[1] * ux - v[0] * uy)) };
}

  const o = {};
  for (const k of ['x', 'y', 'w', 'h', 'tl', 'tr', 'brx', 'bry', 'bl']) o[k] = lerp(a[k], c[k], p);
  o.c = [0, 1, 2].map((i) => lerp(a.c[i], c.c[i], clamp(p)));

}

function fullPose(t) {
  const cam = camera(t);

// Rangkaian perubahan ubin: [mulai (dtk), durasi pegas, pose tujuan (fungsi waktu)].
let CHAIN = [];
function buildChain() {
  CHAIN = [
    [b(3), 0.5, () => P.center],
    [b(4), 0.62, () => P.rowIcon],
    [b(16), 0.5, () => P.chipPem],
    [b(26), 0.62, () => P.mark0],
    [b(31.3), 0.62, () => P.chipTrf],
    [b(41.0), 0.6, () => P.tokBca],
    [b(43.0), 0.42, () => P.tokMan],
    [b(44.0), 0.6, () => P.tokTx],
    [b(47.6), 0.55, () => P.bar],
    [b(60.0), 0.8, () => P.totMark],
    [b(63.0), 0.3, () => pose(P.totMark.x + 4, P.totMark.y + 4, 26, 26, 8)],
    [b(64.0), 0.42, (t) => fullPose(t)],
    [b(68.0), 0.62, () => P.leaf],
    [b(75.0), 0.22, () => P.leafBlue],
    [b(75.3), 0.38, () => P.offLeft],
  ];
}
function tileAt(t) {
  let cur = P.offLeft;
  for (let i = 0; i < CHAIN.length; i++) {
    const [t0, dur, target] = CHAIN[i];
    if (t < t0) return cur;
    const next = CHAIN[i + 1];
    const tgt = target(t);
    const p = i === CHAIN.length - 1 ? spring(t - t0, dur) : spring(t - t0, dur);
    cur = mixPose(cur, tgt, p);
    if (next && t < next[0]) return cur;
    // titik awal transisi berikutnya = pose saat transisi ini diputus
  }
  return cur;
}

// Isi ubin: [indeks lapisan, masuk, keluar]
const TL = [
  [0, -1, b(16)], [1, b(16.12), b(26)], [2, b(26.12), b(31.3)], [3, b(31.42), b(41)], [4, b(41.1), b(47.6)], [0, b(75.05), 1e9],

// ───────────────────────── helper tampilan ─────────────────────────
function maskY(t, tIn, tOut = null, dIn = 0.42, dOut = 0.26, outDir = -1) {
  // 135%: cukup jauh agar ekor huruf (g, y, p) tidak mengintip dari tepi mask.
  if (t < tIn) return 135;
  let y = (1 - spring(t - tIn, dIn)) * 135;
  if (tOut !== null && t > tOut) y += outDir * expoIn(prog(t, tOut, dOut)) * 135;
  return y;
}
function setMask(id, t, tIn, tOut = null, dIn = 0.42, dOut = 0.26, outDir = -1) {
  $(id).style.transform = `translateY(${maskY(t, tIn, tOut, dIn, dOut, outDir).toFixed(2)}%)`;
}
/** Kartu terbuka dari `from` (kotak dunia) menjadi ukuran penuhnya, lalu (opsional) terlipat ke `to`. */
function unfold(id, t, tIn, from, dIn = 0.55, tOut = null, to = null, dOut = 0.38, radius = 24) {
  const el = $(id), r = R[id];
  if (t < tIn || (tOut !== null && t > tOut + dOut)) { el.style.visibility = 'hidden'; return; }
  const p = Math.min(1, spring(t - tIn, dIn));
  let top = (from.y - r.y) * (1 - p), left = (from.x - r.x) * (1 - p);
  let right = (r.x + r.w - (from.x + from.w)) * (1 - p), bottom = (r.y + r.h - (from.y + from.h)) * (1 - p);
  let rad = lerp(Math.min(radius, from.h / 2, from.w / 2 || 1e9), radius, p);
  if (tOut !== null && t > tOut) {
    const q = expoIn(prog(t, tOut, dOut)), z = to || from;
    top = lerp(top, z.y - r.y, q); left = lerp(left, z.x - r.x, q);
    right = lerp(right, r.x + r.w - (z.x + z.w), q); bottom = lerp(bottom, r.y + r.h - (z.y + z.h), q);
    rad = lerp(rad, Math.min(radius, z.h / 2), q);
  }
  el.style.visibility = 'visible';
  el.style.clipPath = `inset(${Math.max(0, top)}px ${Math.max(0, right)}px ${Math.max(0, bottom)}px ${Math.max(0, left)}px round ${rad}px)`;
}
const growScale = (t, tIn, dur = 0.45) => (t < tIn ? 0 : spring(t - tIn, dur));
function setGrow(id, t, tIn, dur = 0.45, origin = '50% 50%') {
  const s = growScale(t, tIn, dur), el = $(id);
  el.style.transformOrigin = origin;
  el.style.transform = `scale(${s.toFixed(4)})`;
  el.style.visibility = s <= 0.001 ? 'hidden' : 'visible';
}
/** Fokus tumbuh & lepas dengan pegas singkat (bukan saklar) — tak ada perubahan instan. */
const focusAmt = (t, tOn, tOff) => clamp(spring(t - tOn, 0.3)) * (1 - clamp(spring(t - tOff, 0.3)));
const focusRing = (id, t, tOn, tOff) => {

function sceneTile(t, cam) {
  const p = tileAt(t);
  const dt = 1 / 240, q = tileAt(t - dt);
  const vx = (p.x + p.w / 2 - (q.x + q.w / 2)) / dt, vy = (p.y + p.h / 2 - (q.y + q.h / 2)) / dt;
  const speed = Math.hypot(vx, vy) * cam.z; // px layar per detik

  outer.style.visibility = visible ? 'visible' : 'hidden';

  outer.style.transform = `translate(${(p.x + p.w / 2).toFixed(2)}px,${(p.y + p.h / 2).toFixed(2)}px) rotate(${useBlur ? ang.toFixed(2) : 0}deg)`;

  $('mbBlur').setAttribute('stdDeviation', `${useBlur ? blur.toFixed(2) : 0} 0`);
  inner.style.left = (-p.w / 2).toFixed(2) + 'px';
  inner.style.top = (-p.h / 2).toFixed(2) + 'px';
  inner.style.width = p.w.toFixed(2) + 'px';
  inner.style.height = p.h.toFixed(2) + 'px';
  inner.style.transform = `rotate(${useBlur ? (-ang).toFixed(2) : 0}deg)`;
  inner.style.borderRadius = `${p.tl.toFixed(2)}px ${p.tr.toFixed(2)}px ${p.brx.toFixed(2)}px ${p.bl.toFixed(2)}px / ${p.tl.toFixed(2)}px ${p.tr.toFixed(2)}px ${p.bry.toFixed(2)}px ${p.bl.toFixed(2)}px`;
  inner.style.background = `rgb(${p.c.map((v) => Math.round(v)).join(',')})`;
  // Ikon gedung menyesuaikan ukuran ubin.
  const iconPx = Math.max(10, Math.min(72, 0.44 * Math.min(p.w, p.h)));
  $('tl0svg').setAttribute('width', iconPx.toFixed(1));
  $('tl0svg').setAttribute('height', iconPx.toFixed(1));
  for (let i = 0; i < 5; i++) {
    let y = 120;
    for (const [idx, tIn, tOut] of TL) {
      if (idx !== i || t < tIn - 0.0001) continue;
      if (tOut < 1e9 && t > tOut + 0.3) continue;
      y = maskY(t, tIn, tOut, 0.38, 0.22, -1);
    }
    $(`tl${i}`).style.transform = `translateY(${y.toFixed(2)}%)`;
  }
}

function sceneOverlay(t) {
  // Keluar (teks lalu kotak, selesai tOut+0,44 dtk) sebelum kamera mulai pindah — UI tak pernah lewat di bawah kotak.
  const caps = [['cap1', b(11), b(14.4)], ['cap2', b(28), b(30.65)], ['cap3', b(45.1), b(47.25)], ['cap4', b(56), b(59.05)]];
  for (const [id, tIn, tOut] of caps) {
    const el = $(id);
    if (t < tIn || t > tOut + 0.46) { el.style.visibility = 'hidden'; continue; }
    el.style.visibility = 'visible';
    const pIn = Math.min(1, spring(t - tIn, 0.5));
    const pOut = expoIn(prog(t, tOut + 0.2, 0.24));
    const hide = Math.max(0, Math.min(100, (1 - pIn) * 100 + pOut * 100));
    el.style.clipPath = `inset(0 ${hide.toFixed(2)}% 0 0 round 30px)`;
    for (let i = 0; i < 2; i++) setMask(`${id}l${i}`, t, tIn + 0.1 + i * 0.09, tOut + i * 0.06, 0.42, 0.22, 1);
  }
  // Payoff: angka besar di atas ubin yang memenuhi layar. Ubin & teks ada di ruang layar, jadi dorongan
  // 1,0 → 1,04 diberikan ke teks sendiri — kalau tidak, layar biru diam ±0,7 dtk (hold).
  $('bigWrap').style.transform = `scale(${(1 + 0.04 * prog(t, b(64), b(4))).toFixed(5)})`;
  setMask('bigLbl', t, b(64.25), b(67.2), 0.4, 0.25, -1);
  setMask('bigNum', t, b(64.3), b(67.3), 0.45, 0.26, -1);
  setMask('bigKey', t, b(65), b(67.4), 0.42, 0.24, -1);
  $('bigNum').textContent = rp(valAt('big', t, 0.9));
  $('bigUl').style.transform = `scaleX(${growScale(t, b(66), 0.5).toFixed(4)})`;
}

function sceneEnd(t) {
  const L = R.logo, leaf = R.leaf;
  const cx = leaf.x + leaf.w / 2 - L.x, cy = leaf.y + leaf.h / 2 - L.y;
  const open = spring(t - b(69), 0.6) * (1 - expoIn(prog(t, b(74.55), 0.32)));
  const rad = open * 470;
  const logo = $('logo');
  logo.style.visibility = t > b(68.7) && rad > 0.5 ? 'visible' : 'hidden';
  logo.style.clipPath = `circle(${rad.toFixed(2)}px at ${cx.toFixed(1)}px ${cy.toFixed(1)}px)`;
  setMask('endName', t, b(70), b(74), 0.45, 0.26, 1);
  setMask('endLine', t, b(71), b(74.1), 0.45, 0.26, 1);
  $('endUl').style.transform = `scaleX(${(growScale(t, b(72), 0.5) * (1 - expoIn(prog(t, b(74), 0.2)))).toFixed(4)})`;
  const bk = growScale(t, b(73), 0.42) * (1 - expoIn(prog(t, b(74.1), 0.22)));
  $('endBook').style.transform = `scale(${bk.toFixed(4)})`;
}

// ───────────────────────── seek ─────────────────────────
function seek(time) {
  const t = ((time % DURATION) + DURATION) % DURATION;
  const cam = camera(t);
  $('world').style.transform = `translate(${W / 2}px,${H / 2}px) scale(${cam.z.toFixed(5)}) translate(${(-cam.cx).toFixed(3)}px,${(-cam.cy).toFixed(3)}px)`;
  const cb = cameraBlur(t, cam), blurOn = Math.max(cb.par, cb.perp) > 0.6;
  $('camBlur').style.transform = blurOn ? `rotate(${cb.ang.toFixed(3)}deg)` : 'none';
  $('camUnrot').style.transform = blurOn ? `rotate(${(-cb.ang).toFixed(3)}deg)` : 'none';
  $('camBlur').style.filter = blurOn ? 'url(#cb)' : 'none';
  $('cbBlur').setAttribute('stdDeviation', blurOn ? `${cb.par.toFixed(2)} ${cb.perp.toFixed(2)}` : '0 0');
  sceneHook(t);
  scenePage(t);
  sceneDialogs(t);
  sceneCursor(t);
  sceneTile(t, cam);
  sceneOverlay(t);
  sceneEnd(t);
}
window.seek = seek;

// Waktu kata hook "disela" ubin: saat pusat ubin melewati pusat kata (atau sesaat setelah ubin berhenti).
function computeKnock() {
  let arrive = b(3.5);
  for (let t = b(3); t < b(4); t += 1 / 480) { const p = tileAt(t); if (Math.abs(p.x + p.w / 2 - 960) < 6) { arrive = t; break; } }
  KNOCK = R.hw.map((r) => {
    const cxw = r.x + r.w / 2;
    for (let t = b(3); t < arrive; t += 1 / 480) {
      const p = tileAt(t);
      if (p.x + p.w / 2 >= cxw - 40) return t;
    }
    return arrive + (cxw - 960) / 4000; // kata di kanan disapu gelombang saat ubin mendarat
  });
}

// ───────────────────────── audio (OfflineAudioContext → WAV) ─────────────────────────
window.renderAudio = async function renderAudio() {
  const SR = 48000, N = Math.ceil(DURATION * SR);
  const ctx = new OfflineAudioContext(2, N, SR);
  let seed = 20261012;
  const rnd = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296) * 2 - 1;
  const nb = ctx.createBuffer(1, SR * 3, SR); const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = rnd();
  const bus = ctx.createGain(); bus.gain.value = 0.7;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 10; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
  bus.connect(comp); comp.connect(ctx.destination);
  const env = (g, t, peak, attack, dur) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); };
  const noise = (t, dur, peak, type, freq, q = 0.7, attack = 0.002, f2 = null) => {
    const s = ctx.createBufferSource(); s.buffer = nb;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain(); env(g, t, peak, attack, dur);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t, (t * 0.37) % 2); s.stop(t + dur + 0.05);
  };
  const tone = (t, dur, freq, peak, type = 'sine', freqEnd = null, attack = 0.004, glide = 0.12, cut = null) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + glide);
    const g = ctx.createGain(); env(g, t, peak, attack, dur);
    if (cut) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; o.connect(f); f.connect(g); } else o.connect(g);
    g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
  };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // Kick di setiap ketukan.
  for (let i = 0; i < BEATS; i++) {
    const t = i * BEAT, big = i === 64;
    tone(t, big ? 0.6 : 0.42, 150, big ? 1.0 : 0.82, 'sine', 42, 0.003, 0.11);
    noise(t, 0.02, big ? 0.35 : 0.22, 'highpass', 2500, 0.7, 0.001);
  }
  // Hi-hat lembut di sela ketukan.
  for (let i = 0; i < BEATS; i++) noise(i * BEAT + BEAT / 2, 0.05, i % 4 === 3 ? 0.075 : 0.05, 'highpass', 8500);
  // Bass & pad: Am – F – C – G per bar.
  const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  for (let bar = 0; bar < BEATS / 4; bar++) {
    const t = bar * 4 * BEAT, ch = PROG[bar % 4], root = ch[0] - 24;
    for (const off of [0, 1.5, 2, 3.5]) tone(t + off * BEAT, 0.34, mtof(root + (off === 3.5 ? 12 : 0)), 0.2, 'triangle', null, 0.006, 0.1, 900);
    for (const n of ch) {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(n);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.03, t + 0.35); g.gain.setValueAtTime(0.03, t + 4 * BEAT - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + 4 * BEAT);
      o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + 4 * BEAT + 0.02);
    }
  }
  // Hit di setiap pergantian adegan (+ desir naik sebelumnya); ketukan 64 paling besar.
  for (const bt of [3, 4, 16, 32, 48, 60, 64, 68]) {
    const t = bt * BEAT, big = bt === 64;
    tone(t, big ? 1.9 : 1.0, 58, big ? 0.85 : 0.5, 'sine', 40, 0.004, 0.4);
    noise(t, big ? 1.3 : 0.45, big ? 0.32 : 0.16, 'bandpass', big ? 1600 : 1100, 0.8, 0.003);
    for (const n of PROG[Math.floor(bt / 4) % 4]) tone(t, big ? 1.2 : 0.55, mtof(n + 12), big ? 0.07 : 0.045, 'sawtooth', null, 0.005, 0.1, big ? 2600 : 1800);
    if (bt > 3) {
      const s = ctx.createBufferSource(); s.buffer = nb;
      const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.setValueAtTime(600, t - BEAT); f.frequency.exponentialRampToValueAtTime(5000, t);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t - BEAT); g.gain.exponentialRampToValueAtTime(big ? 0.2 : 0.1, t - 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      s.connect(f); f.connect(g); g.connect(bus); s.start(t - BEAT, 1.1); s.stop(t + 0.06);
    }
  }
  // Klik kursor & ketukan tombol saat mengetik.
  for (const tc of CLICKS) { tone(tc, 0.035, 2300, 0.16, 'sine', 1700, 0.001, 0.03); noise(tc, 0.018, 0.09, 'highpass', 4500, 0.7, 0.001); }
  for (const tc of window.TYPE_TIMES) noise(tc, 0.022, 0.045, 'bandpass', 3600, 1.4, 0.001);

  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), Rr = buf.getChannelData(1);
  let peak = 1e-6;
  for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(Rr[i]));
  const k = 0.89 / peak, n = L.length;
  const ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); wstr(8, 'WAVE'); wstr(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, SR, true);
  dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); wstr(36, 'data'); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    dv.setInt16(44 + i * 4, Math.max(-32767, Math.min(32767, Math.round(L[i] * k * 32767))), true);
    dv.setInt16(46 + i * 4, Math.max(-32767, Math.min(32767, Math.round(Rr[i] * k * 32767))), true);
  }
  const u8 = new Uint8Array(ab); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
};

// ───────────────────────── siap ─────────────────────────
window.ready = (async () => {
  build();
  await Promise.all([400, 500, 600, 700, 800].map((w) => document.fonts.load(`${w} 40px "Plus Jakarta Sans"`)));
  await document.fonts.ready;
  const img = $('logo');
  if (!img.complete) await new Promise((res) => { img.onload = res; img.onerror = res; });
  measure();
  layoutEnd();
  buildPoses();
  buildChain();
  buildCursor();
  computeKnock();
  seek(0);
  return { fonts: document.fonts.check('800 40px "Plus Jakarta Sans"'), duration: DURATION };
})();
</script>
